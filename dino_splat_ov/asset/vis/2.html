<style>
    * {
        padding: 0;
        margin: 0;
    }

    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    /* 每一组4张图：2行2列网格 */
    ul {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 2px;
        /* 图片之间间距，按需修改 */
        max-width: 600px;
        /* 整组最大宽度，按需调整 */
        padding: 5px;
    }

    ul li {
        list-style: none;
        position: relative;
        /* width: 100%;
        aspect-ratio: 1 / 1; */
    }

    ul li img {
        width: 100%;
        height: 100%;
        /* 强制正方形 */
        aspect-ratio: 1 / 1;
        object-fit: cover;
        /* 等比例填满正方形，超出部分裁剪；不想裁剪改为 contain */
        display: block;
        overflow: hidden;
    }

    .wrap {
        display: flex;
    }

    li p {
        position: absolute;
        top: 2px;
        left: 2px;
        background: #fff;
        font-size: 12px;
        line-height: 12px;
        padding: 1px;
    }
    b{
        padding: 5px;
    }
</style>
